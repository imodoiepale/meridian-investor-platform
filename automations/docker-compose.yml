version: "3.8"

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imm-api-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HEADLESS=true
      - AUTO_CLOSE=true
      - SLOW_MO=100
      - NODE_ENV=production
    restart: always

